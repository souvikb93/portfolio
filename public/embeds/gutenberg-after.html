<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 2 – Following Gutenberg</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: transparent;
  }

  .card {
    width: 172px;
    height: 112px;
    background: #ffffff;
    border-radius: 8px;
    
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── Navbar ── */
  .navbar {
    height: 24px;
    background: #ffffff;
    display: flex;
    align-items: center;
    padding: 0 7px;
    flex-shrink: 0;
    border-bottom: 1px solid #e8eaf2;
  }

  .logo-circle {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #c5c9de;
    flex-shrink: 0;
    margin-right: 6px;
  }

  .nav-pills {
    display: flex; gap: 4px; flex: 1; justify-content: center;
  }
  .nav-pills span {
    display: block; height: 5px; border-radius: 3px; background: #d2d6ea;
  }
  .nav-pills span:nth-child(1) { width: 20px; }
  .nav-pills span:nth-child(2) { width: 20px; }
  .nav-pills span:nth-child(3) { width: 20px; }

  .nav-cta {
    width: 32px; height: 14px;
    background: #3a3f58;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* ── Body ── */
  .body {
    flex: 1;
    display: flex;
    padding: 8px;
    gap: 8px;
    align-items: flex-start;
  }

  /* LEFT: image block */
  .left-col {
    width: 60px; height: 60px;
    background: #b8c0d6;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .left-col svg { width: 22px; height: 22px; opacity: 0.5; }

  /* RIGHT: text + CTA anchored bottom-right */
  .right-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .text-block {
    display: flex; flex-direction: column; gap: 4px; padding-top: 2px;
  }
  .text-block span {
    display: block; height: 4px; border-radius: 2px; background: #c5c9de;
  }
  .text-block span:nth-child(1) { width: 90%; }
  .text-block span:nth-child(2) { width: 75%; }
  .text-block span:nth-child(3) { width: 60%; }

  .cta-row {
    display: flex; gap: 4px; margin-top: 8px; justify-content: flex-end;
  }
  .cta-ghost { width: 26px; height: 11px; background: #c5c9de; border-radius: 3px; }
  .cta-solid { width: 30px; height: 11px; background: #3a3f58; border-radius: 3px; }

  /* ── Layers ── */
  .layer {
    position: absolute;
    top: 0; left: 0;
    width: 172px; height: 112px;
    pointer-events: none;
  }
  #trail-canvas { z-index: 18; }
  #dot-svg      { z-index: 19; overflow: visible; }
  #stamps-svg   { z-index: 21; overflow: visible; }
</style>
</head>
<body>
  <div class="card">
    <div class="navbar">
      <div class="logo-circle"></div>
      <div class="nav-pills">
        <span></span><span></span><span></span>
      </div>
      <div class="nav-cta"></div>
    </div>

    <div class="body">
      <div class="left-col">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </div>
      <div class="right-col">
        <div class="text-block">
          <span></span><span></span><span></span>
        </div>
        <div class="cta-row">
          <div class="cta-ghost"></div>
          <div class="cta-solid"></div>
        </div>
      </div>
    </div>

    <!-- Layer 1: trail canvas -->
    <canvas id="trail-canvas" class="layer"></canvas>

    <!-- Layer 2: travelling dot -->
    <svg id="dot-svg" class="layer" viewBox="0 0 172 112">
      <defs>
        <filter id="glow-dot">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle id="dot" cx="13" cy="12" r="3.4"
        fill="#22c55e" filter="url(#glow-dot)"/>
      <line id="arm1" x1="0" y1="0" x2="0" y2="0"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0"/>
      <line id="arm2" x1="0" y1="0" x2="0" y2="0"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0"/>
    </svg>

    <!-- Layer 3: permanent stamps (top) -->
    <svg id="stamps-svg" class="layer" viewBox="0 0 172 112">
      <defs>
        <filter id="glow-stamp">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="stamps"></g>
    </svg>
  </div>

<script>
  // ─── Waypoints ─────────────────────────────────────────────
  // 1: logo circle center    (13, 12)
  // 2: nav CTA center        (149, 12)
  // 3: image block center    (38, 62)
  // 4: cta-solid center      (149, 68)
  const WP = [
    { x: 13,  y: 12 },
    { x: 149, y: 12 },
    { x: 38,  y: 62 },
    { x: 149, y: 68 },
  ];

  const DOT_SMALL = 3.4;
  const DOT_BIG   = 10;
  const SPEED     = 60;    // px/s
  const EXPAND_MS = 300;
  const HOLD_MS   = 450;
  const END_PAUSE = 1400;

  // Canvas
  const canvas = document.getElementById('trail-canvas');
  const ctx    = canvas.getContext('2d');
  const DPR    = window.devicePixelRatio || 2;
  canvas.width  = 172 * DPR;
  canvas.height = 112 * DPR;
  canvas.style.width  = '172px';
  canvas.style.height = '112px';
  ctx.scale(DPR, DPR);

  const svgNS  = 'http://www.w3.org/2000/svg';
  const dot    = document.getElementById('dot');
  const arm1   = document.getElementById('arm1');
  const arm2   = document.getElementById('arm2');
  const stamps = document.getElementById('stamps');

  const dist  = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
  const lerp1 = (a, b, t) => a + (b - a) * t;
  const lerp2 = (a, b, t) => ({ x: lerp1(a.x, b.x, t), y: lerp1(a.y, b.y, t) });
  const ease  = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function setDot(x, y, r) {
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    dot.setAttribute('r', r);
  }

  function showDot(v) {
    dot.setAttribute('opacity', v ? 1 : 0);
    arm1.setAttribute('opacity', 0);
    arm2.setAttribute('opacity', 0);
  }

  function setLiveArms(cx, cy, r, op) {
    // Tick mark: short left stroke + long right stroke
    const sw = clamp(r * 0.26, 1.6, 2.4);
    // Short left arm: top-left to mid-bottom of tick
    arm1.setAttribute('x1', cx - r*0.35); arm1.setAttribute('y1', cy + r*0.05);
    arm1.setAttribute('x2', cx - r*0.05); arm1.setAttribute('y2', cy + r*0.38);
    // Long right arm: mid-bottom up to top-right
    arm2.setAttribute('x1', cx - r*0.05); arm2.setAttribute('y1', cy + r*0.38);
    arm2.setAttribute('x2', cx + r*0.40); arm2.setAttribute('y2', cy - r*0.32);
    arm1.setAttribute('stroke-width', sw);
    arm2.setAttribute('stroke-width', sw);
    arm1.setAttribute('opacity', op);
    arm2.setAttribute('opacity', op);
  }

  function stampDot(cx, cy) {
    const g = document.createElementNS(svgNS, 'g');
    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy);
    c.setAttribute('r', DOT_BIG);
    c.setAttribute('fill', '#22c55e');
    c.setAttribute('filter', 'url(#glow-stamp)');
    g.appendChild(c);

    const r  = DOT_BIG;
    const sw = clamp(r * 0.26, 1.6, 2.4);
    // Tick: two strokes forming a checkmark
    const tickPts = [
      // short left stroke
      [cx - r*0.35, cy + r*0.05, cx - r*0.05, cy + r*0.38],
      // long right stroke
      [cx - r*0.05, cy + r*0.38, cx + r*0.40, cy - r*0.32],
    ];
    tickPts.forEach(([x1,y1,x2,y2]) => {
      const l = document.createElementNS(svgNS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', 'white');
      l.setAttribute('stroke-width', sw);
      l.setAttribute('stroke-linecap', 'round');
      l.setAttribute('stroke-linejoin', 'round');
      g.appendChild(l);
    });
    stamps.appendChild(g);
  }

  // Trail
  let trailPts = [];

  function recordPt(x, y) {
    const last = trailPts[trailPts.length - 1];
    if (!last || Math.abs(last.x - x) > 0.1 || Math.abs(last.y - y) > 0.1)
      trailPts.push({ x, y });
  }

  function drawTrail() {
    ctx.clearRect(0, 0, 172, 112);
    if (trailPts.length < 2) return;
    ctx.save();
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth   = 1.8;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.setLineDash([4, 4]);
    ctx.shadowColor = '#22c55e';
    ctx.shadowBlur  = 3;
    ctx.beginPath();
    ctx.moveTo(trailPts[0].x, trailPts[0].y);
    for (let i = 1; i < trailPts.length; i++) ctx.lineTo(trailPts[i].x, trailPts[i].y);
    ctx.stroke();
    ctx.restore();
  }

  function resetAll(now) {
    trailPts = [];
    ctx.clearRect(0, 0, 172, 112);
    stamps.innerHTML = '';
    setDot(WP[0].x, WP[0].y, DOT_SMALL);
    showDot(true);
    recordPt(WP[0].x, WP[0].y);
    return now;
  }

  const steps = [
    { type: 'travel', from: WP[0], to: WP[1] },
    { type: 'expand', at: WP[1] },
    { type: 'hold',   at: WP[1] },
    { type: 'travel', from: WP[1], to: WP[2] },
    { type: 'expand', at: WP[2] },
    { type: 'hold',   at: WP[2] },
    { type: 'travel', from: WP[2], to: WP[3] },
    { type: 'expand', at: WP[3] },
    { type: 'hold',   at: WP[3] },
    { type: 'pause' },
  ];

  function stepDuration(s) {
    if (s.type === 'travel') return (dist(s.from, s.to) / SPEED) * 1000;
    if (s.type === 'expand') return EXPAND_MS;
    if (s.type === 'hold')   return HOLD_MS;
    if (s.type === 'pause')  return END_PAUSE;
    return 0;
  }

  let stepIdx   = 0;
  let stepStart = 0;

  function tick(now) {
    if (stepStart === 0) stepStart = resetAll(now);

    const s       = steps[stepIdx];
    const elapsed = now - stepStart;
    const dur     = stepDuration(s);
    const t       = clamp(elapsed / dur, 0, 1);
    const et      = ease(t);

    if (s.type === 'travel') {
      const pos = lerp2(s.from, s.to, et);
      setDot(pos.x, pos.y, DOT_SMALL);
      showDot(t > 0.15);
      arm1.setAttribute('opacity', 0);
      arm2.setAttribute('opacity', 0);
      recordPt(pos.x, pos.y);
    }
    else if (s.type === 'expand') {
      const r = lerp1(DOT_SMALL, DOT_BIG, et);
      setDot(s.at.x, s.at.y, r);
      showDot(true);
      setLiveArms(s.at.x, s.at.y, r, et);
    }
    else if (s.type === 'hold') {
      setDot(s.at.x, s.at.y, DOT_BIG);
      showDot(true);
      setLiveArms(s.at.x, s.at.y, DOT_BIG, 1);
    }
    else if (s.type === 'pause') {
      showDot(false);
    }

    drawTrail();

    if (t >= 1) {
      if (s.type === 'hold') {
        stampDot(s.at.x, s.at.y);
        arm1.setAttribute('opacity', 0);
        arm2.setAttribute('opacity', 0);
        setDot(s.at.x, s.at.y, DOT_SMALL);
      }
      stepIdx++;
      stepStart = now;
      if (stepIdx >= steps.length) {
        stepIdx   = 0;
        stepStart = resetAll(now);
      }
    }

    requestAnimationFrame(tick);
  }

  // The travelling dot IS the point of this plate, so when motion is not wanted
  // the finished path is drawn at once: every waypoint stamped, trail complete.
  function drawFinishedPath() {
    trailPts = [];
    stamps.innerHTML = '';
    for (let i = 0; i < WP.length; i++) {
      if (i > 0) {
        const steps = Math.max(2, Math.round(dist(WP[i - 1], WP[i])));
        for (let k = 1; k <= steps; k++) {
          const p = lerp2(WP[i - 1], WP[i], k / steps);
          recordPt(p.x, p.y);
        }
      } else {
        recordPt(WP[0].x, WP[0].y);
      }
      stampDot(WP[i].x, WP[i].y);
    }
    showDot(false);
    drawTrail();
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    drawFinishedPath();
  } else {
    // 1.5s initial delay, then loop in sync
    stepStart = 0;
    setTimeout(() => requestAnimationFrame(tick), 1500);
  }
</script>
</body>
</html>
