<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 1 – Not Following Gutenberg</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: transparent;
  }

  .card {
    width: 172px;
    height: 112px;
    background: #ffffff;
    border-radius: 8px;
    
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: visible;
  }

  .navbar {
    height: 28px;
    background: #ffffff;
    border-radius: 8px 8px 0 0;
    display: flex;
    align-items: center;
    padding: 0 8px;
    flex-shrink: 0;
    border-bottom: 1px solid #dde0ec;
  }

  .logo-circle {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #b8bdd4;
    flex-shrink: 0;
  }

  .nav-spacer {
    flex: 1; display: flex; justify-content: center; gap: 5px;
  }
  .nav-spacer span {
    display: block; width: 20px; height: 5px;
    border-radius: 3px; background: #cdd2e5;
  }

  .nav-cta {
    width: 36px; height: 15px;
    background: #3a3f5c;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .body {
    flex: 1;
    display: flex;
    padding: 8px;
    gap: 8px;
    align-items: flex-start;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
  }

  .left-col {
    flex: 1; display: flex; flex-direction: column;
    gap: 3px; padding-top: 2px;
  }

  .text-line { height: 5px; border-radius: 3px; background: #c4c9de; }
  .text-line:nth-child(1) { width: 82%; }
  .text-line:nth-child(2) { width: 67%; }
  .text-line:nth-child(3) { width: 52%; }

  .cta-row { display: flex; gap: 5px; margin-top: 11px; }
  .cta-ghost { width: 28px; height: 12px; background: #c4c9de; border-radius: 3px; }
  .cta-solid { width: 32px; height: 12px; background: #3a3f5c; border-radius: 3px; }

  .right-col {
    width: 64px; height: 64px; background: #b5bdd6;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .right-col svg { width: 24px; height: 24px; opacity: 0.45; }

  /* Layer order (z-index):
     18 = trail canvas
     21 = stamps SVG  (persistent dots+crosses — TOP layer)
     20 = dot SVG     (travelling dot always on top)
  */
  .layer {
    position: absolute;
    top: 0; left: 0;
    width: 172px; height: 112px;
    pointer-events: none;
  }
  #trail-canvas { z-index: 18; }
  #stamps-svg   { z-index: 21; overflow: visible; }
  #dot-svg      { z-index: 19; overflow: visible; }
</style>
</head>
<body>
  <div class="card">
    <div class="navbar">
      <div class="logo-circle"></div>
      <div class="nav-spacer"><span></span><span></span><span></span></div>
      <div class="nav-cta"></div>
    </div>
    <div class="body">
      <div class="left-col">
        <div class="text-line"></div>
        <div class="text-line"></div>
        <div class="text-line"></div>
        <div class="cta-row">
          <div class="cta-ghost"></div>
          <div class="cta-solid"></div>
        </div>
      </div>
      <div class="right-col">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
      </div>
    </div>

    <!-- Layer 1: dotted trail canvas -->
    <canvas id="trail-canvas" class="layer"></canvas>

    <!-- Layer 2: permanent stamped dots+crosses -->
    <svg id="stamps-svg" class="layer" viewBox="0 0 172 112">
      <defs>
        <filter id="glow-stamp">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="stamps"></g>
    </svg>

    <!-- Layer 3: travelling dot (always on top of stamps) -->
    <svg id="dot-svg" class="layer" viewBox="0 0 172 112">
      <defs>
        <filter id="glow-dot">
          <feGaussianBlur stdDeviation="1.5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Travelling dot -->
      <circle id="dot" cx="15" cy="14" r="3.4"
        fill="#e53e3e" filter="url(#glow-dot)"/>

      <!-- Live cross arms shown during expand phase only -->
      <line id="arm1" x1="0" y1="0" x2="0" y2="0"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0"/>
      <line id="arm2" x1="0" y1="0" x2="0" y2="0"
        stroke="white" stroke-width="2" stroke-linecap="round" opacity="0"/>
    </svg>
  </div>

<script>
  // Waypoints
  const WP = [
    { x: 15,  y: 14 },   // A — logo circle
    { x: 146, y: 14 },   // B — nav CTA
    { x: 132, y: 68 },   // C — image center
    { x: 57,  y: 79 },   // D — cta-solid center
  ];

  const DOT_SMALL = 3.4;
  const DOT_BIG   = 10;
  const SPEED     = 60;    // px/s
  const EXPAND_MS = 300;
  const HOLD_MS   = 450;
  const END_PAUSE = 3172;

  // Canvas setup
  const canvas = document.getElementById('trail-canvas');
  const ctx    = canvas.getContext('2d');
  const DPR    = window.devicePixelRatio || 2;
  canvas.width  = 172 * DPR;
  canvas.height = 112 * DPR;
  canvas.style.width  = '172px';
  canvas.style.height = '112px';
  ctx.scale(DPR, DPR);

  const svgNS  = 'http://www.w3.org/2000/svg';
  const dot    = document.getElementById('dot');
  const arm1   = document.getElementById('arm1');
  const arm2   = document.getElementById('arm2');
  const stamps = document.getElementById('stamps');

  // Helpers
  const dist  = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
  const lerp1 = (a, b, t) => a + (b - a) * t;
  const lerp2 = (a, b, t) => ({ x: lerp1(a.x, b.x, t), y: lerp1(a.y, b.y, t) });
  const ease  = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function setDot(x, y, r) {
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    dot.setAttribute('r', r);
  }

  function showDot(visible) {
    dot.setAttribute('opacity', visible ? 1 : 0);
    arm1.setAttribute('opacity', 0);
    arm2.setAttribute('opacity', 0);
  }

  function setLiveArms(cx, cy, r, op) {
    const a  = r * 0.35;
    const sw = clamp(r * 0.26, 1.6, 2.4);
    arm1.setAttribute('x1', cx - a); arm1.setAttribute('y1', cy - a);
    arm1.setAttribute('x2', cx + a); arm1.setAttribute('y2', cy + a);
    arm2.setAttribute('x1', cx + a); arm2.setAttribute('y1', cy - a);
    arm2.setAttribute('x2', cx - a); arm2.setAttribute('y2', cy + a);
    arm1.setAttribute('stroke-width', sw);
    arm2.setAttribute('stroke-width', sw);
    arm1.setAttribute('opacity', op);
    arm2.setAttribute('opacity', op);
  }

  // Permanently stamp an expanded dot+cross onto the stamps layer
  function stampDot(cx, cy) {
    const g = document.createElementNS(svgNS, 'g');

    const c = document.createElementNS(svgNS, 'circle');
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
    c.setAttribute('r', DOT_BIG);
    c.setAttribute('fill', '#e53e3e');
    c.setAttribute('filter', 'url(#glow-stamp)');
    g.appendChild(c);

    const a  = DOT_BIG * 0.35;
    const sw = clamp(DOT_BIG * 0.26, 1.6, 2.4);

    [[-1,-1,1,1],[1,-1,-1,1]].forEach(([x1s,y1s,x2s,y2s]) => {
      const l = document.createElementNS(svgNS, 'line');
      l.setAttribute('x1', cx + x1s * a); l.setAttribute('y1', cy + y1s * a);
      l.setAttribute('x2', cx + x2s * a); l.setAttribute('y2', cy + y2s * a);
      l.setAttribute('stroke', 'white');
      l.setAttribute('stroke-width', sw);
      l.setAttribute('stroke-linecap', 'round');
      g.appendChild(l);
    });

    stamps.appendChild(g);
  }

  // Trail
  let trailPts = [];

  function recordPt(x, y) {
    const last = trailPts[trailPts.length - 1];
    if (!last || Math.abs(last.x - x) > 0.1 || Math.abs(last.y - y) > 0.1)
      trailPts.push({ x, y });
  }

  function drawTrail() {
    ctx.clearRect(0, 0, 172, 112);
    if (trailPts.length < 2) return;
    ctx.save();
    ctx.strokeStyle = '#e53e3e';
    ctx.lineWidth   = 1.8;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.setLineDash([4, 4]);
    ctx.shadowColor = '#e53e3e';
    ctx.shadowBlur  = 3;
    ctx.beginPath();
    ctx.moveTo(trailPts[0].x, trailPts[0].y);
    for (let i = 1; i < trailPts.length; i++) ctx.lineTo(trailPts[i].x, trailPts[i].y);
    ctx.stroke();
    ctx.restore();
  }

  function resetAll(now) {
    trailPts = [];
    ctx.clearRect(0, 0, 172, 112);
    stamps.innerHTML = '';
    setDot(WP[0].x, WP[0].y, DOT_SMALL);
    showDot(true);
    recordPt(WP[0].x, WP[0].y);
    return now;
  }

  // Steps — no shrink, stamp stays, dot hides during travel departure then reappears
  const steps = [
    { type: 'travel', from: WP[0], to: WP[1] },
    { type: 'expand', at: WP[1] },
    { type: 'hold',   at: WP[1] },
    // after hold: stamp WP[1], hide travelling dot, start travel
    { type: 'travel', from: WP[1], to: WP[2] },
    { type: 'expand', at: WP[2] },
    { type: 'hold',   at: WP[2] },
    { type: 'travel', from: WP[2], to: WP[3] },
    { type: 'expand', at: WP[3] },
    { type: 'hold',   at: WP[3] },
    { type: 'pause' },
  ];

  function stepDuration(s) {
    if (s.type === 'travel') return (dist(s.from, s.to) / SPEED) * 1000;
    if (s.type === 'expand') return EXPAND_MS;
    if (s.type === 'hold')   return HOLD_MS;
    if (s.type === 'pause')  return END_PAUSE;
    return 0;
  }

  let stepIdx   = 0;
  let stepStart = 0;

  function tick(now) {
    if (stepStart === 0) stepStart = resetAll(now);

    const s       = steps[stepIdx];
    const elapsed = now - stepStart;
    const dur     = stepDuration(s);
    const t       = clamp(elapsed / dur, 0, 1);
    const et      = ease(t);

    if (s.type === 'travel') {
      const pos = lerp2(s.from, s.to, et);
      setDot(pos.x, pos.y, DOT_SMALL);
      // Hide the travelling dot for the first ~15% of travel so it doesn't
      // appear to emerge from under the stamp — only show once it has
      // moved clearly away from the stamp origin
      const clearOfStamp = t > 0.15;
      showDot(clearOfStamp);
      arm1.setAttribute('opacity', 0);
      arm2.setAttribute('opacity', 0);
      recordPt(pos.x, pos.y);
    }
    else if (s.type === 'expand') {
      // Travelling dot expands, cross fades in
      const r = lerp1(DOT_SMALL, DOT_BIG, et);
      setDot(s.at.x, s.at.y, r);
      showDot(true);
      setLiveArms(s.at.x, s.at.y, r, et);
    }
    else if (s.type === 'hold') {
      // Full size, cross fully visible
      setDot(s.at.x, s.at.y, DOT_BIG);
      showDot(true);
      setLiveArms(s.at.x, s.at.y, DOT_BIG, 1);
    }
    else if (s.type === 'pause') {
      // Travelling dot hidden — only stamps visible
      showDot(false);
    }

    drawTrail();

    // Advance step
    if (t >= 1) {
      // On leaving a hold: stamp the dot permanently, then hide travelling dot
      if (s.type === 'hold') {
        stampDot(s.at.x, s.at.y);
        arm1.setAttribute('opacity', 0);
        arm2.setAttribute('opacity', 0);
        // Pre-position the small travelling dot at stamp center (hidden until clear)
        setDot(s.at.x, s.at.y, DOT_SMALL);
      }

      stepIdx++;
      stepStart = now;

      if (stepIdx >= steps.length) {
        stepIdx   = 0;
        stepStart = resetAll(now);
      }
    }

    requestAnimationFrame(tick);
  }

  // The travelling dot IS the point of this plate, so when motion is not wanted
  // the finished path is drawn at once: every waypoint stamped, trail complete.
  function drawFinishedPath() {
    trailPts = [];
    stamps.innerHTML = '';
    for (let i = 0; i < WP.length; i++) {
      if (i > 0) {
        const steps = Math.max(2, Math.round(dist(WP[i - 1], WP[i])));
        for (let k = 1; k <= steps; k++) {
          const p = lerp2(WP[i - 1], WP[i], k / steps);
          recordPt(p.x, p.y);
        }
      } else {
        recordPt(WP[0].x, WP[0].y);
      }
      stampDot(WP[i].x, WP[i].y);
    }
    showDot(false);
    drawTrail();
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    drawFinishedPath();
  } else {
    // 1.5s initial delay, then loop in sync
    stepStart = 0;
    setTimeout(() => requestAnimationFrame(tick), 1500);
  }
</script>
</body>
</html>
